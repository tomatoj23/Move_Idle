name: Docs

# 只跑文档侧检查，不下载 Godot（与 game/ 的 validate 工作流分开，避免文档改动触发引擎校验）。
# 与 .githooks/pre-commit 同源：sh tools/check-doc-links.sh

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "schema/**"
      - "AGENTS.md"
      - "CONTEXT.md"
      - "tools/check-doc-links.sh"
      - ".githooks/**"
      - ".gitattributes"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "schema/**"
      - "AGENTS.md"
      - "CONTEXT.md"
      - "tools/check-doc-links.sh"
      - ".githooks/**"
      - ".gitattributes"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check doc cross-references
        # 悬空指针是文档重排 / 回滚后最易腐、肉眼最难发现的一类问题（审计 F2）
        run: sh tools/check-doc-links.sh

  hook-windows:
    # 本机 Windows 是主力开发环境，而 CI 原本只跑 Linux。
    # 行尾（CRLF 让 #!/bin/sh 失效）、hooksPath 未装机、PATH 里没有 sh —— 这三类问题
    # 在 Linux 上永远查不出来，表现是「本机静默失败、CI 全绿」。所以真的跑一次钩子：
    # 不只检查脚本能不能跑，还要验证它真能拦住一次提交。
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install hook (new-clone procedure)
        run: |
          git config core.hooksPath .githooks
          test "$(git config --get core.hooksPath)" = ".githooks"

      - name: Configure committer
        run: |
          git config user.email "ci@example.com"
          git config user.name "CI"

      - name: Clean commit must pass
        run: |
          echo ok > .hook-probe
          git add .hook-probe
          git commit -m "probe: clean commit (hook must pass)"

      - name: Dangling doc ref must be rejected
        run: |
          printf 'see `docs/agents/does-not-exist.md`\n' > docs/_probe.md
          git add docs/_probe.md
          if git commit -m "probe: dangling ref (hook must reject)"; then
            echo "::error::pre-commit hook did NOT reject the dangling doc ref"
            exit 1
          fi
          echo "pre-commit hook rejected it as expected"
          git reset
